name: release

# Tag-driven releases build the binary artifacts (Claude Desktop .mcpb +
# claude.ai skill ZIPs) and attach them to a GitHub Release. Artifacts are
# never committed: Claude's plugin installer rejects repos containing zip
# archives, and the README's stable download links point at
# releases/latest/download/ instead.
#
# Tag must match VERSION / release-contract.json (shared semver train with
# arcadeai-labs/hub — see docs/release-train.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches VERSION
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION != VERSION file $FILE_VERSION"
            exit 1
          fi

      - name: Structural checks
        run: node scripts/check.mjs

      - name: Build Claude-app skill bundles
        run: node scripts/build-claude-skills.mjs

      - name: Build Claude Desktop extension
        working-directory: clients/claude-desktop/mcpb
        run: npx -y @anthropic-ai/mcpb pack . ../arcade-gateway-hub.mcpb

      - name: Build Claude plugin-directory upload zip
        run: node scripts/build-claude-upload-zip.mjs arcade-claude-plugin-upload.zip

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          REQUIRES_HUB=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("release-contract.json","utf8")).requires.hub)')
          gh release create "${GITHUB_REF_NAME}" \
            --title "Arcade Agent Hub plugins ${GITHUB_REF_NAME}" \
            --notes "$(cat <<EOF
          Release-train component: **plugin** \`${VERSION}\`

          - Endpoint: \`https://hub.arcade.dev/mcp\`
          - Compatibility: \`requires hub ${REQUIRES_HUB}\` (see \`release-contract.json\`)
          - Coordinated hub releases use the same \`vX.Y.Z\` tag in \`arcadeai-labs/hub\`

          ## Artifacts
          Claude Desktop \`.mcpb\`, skill ZIPs, and Claude plugin-directory upload zip.
          EOF
          )" \
            clients/claude-desktop/arcade-gateway-hub.mcpb \
            clients/claude-desktop/skills/*.zip \
            arcade-claude-plugin-upload.zip

  # OpenCode installs the plugin from npm, so a release that skips this step
  # leaves `opencode plugin opencode-arcade-hub` serving whatever version was
  # last published by hand — which is how the package fell two releases behind
  # the guidance it ships. Publishing uses npm trusted publishing (OIDC), so
  # there is no stored token: the package on npmjs.com must list this repo and
  # workflow as a trusted publisher. The job fails the release rather than
  # letting npm drift silently again.
  publish-opencode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than the bundled release.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish opencode-arcade-hub
        working-directory: clients/opencode
        run: npm publish --access public

      - name: Explain a publish failure
        if: failure()
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          {
            echo "## OpenCode npm publish failed"
            echo "\`opencode-arcade-hub@${VERSION}\` was not published, so \`opencode plugin opencode-arcade-hub\` still installs the previous version."
            echo "If this is an authentication error, confirm npmjs.com lists this repository and \`release.yml\` as a trusted publisher for the package."
            echo "To unblock the release, publish from a checkout of this tag:"
            echo '```bash'
            echo "cd clients/opencode && npm publish --access public"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
